# =============================================================================
# 水库智能助手（Vue3 + Vite 前端 / Spring Boot 后端）
#
# 面板路径：/www/server/panel/vhost/nginx/zhka.demo.ai.qianxiao.xin.conf
#
# 流量走向：
#   /api/  /auth/  /health  ──反向代理──> Java 后端 127.0.0.1:8085
#   其余路径                 ──直接读取──> root 下的前端构建产物
#
# 与 frontend/vite.config.js 的 server.proxy 一一对应：
#   '/api'    -> 后端（含 SSE 流式对话 /api/chat/stream）
#   '/auth'   -> 后端（登录 / 注册 / 令牌校验）
#   '/health' -> 后端（健康检查）
# 因此前端构建时不要设置 VITE_API_BASE，保持同源相对路径即可。
# =============================================================================

# Java 后端（application.yml: server.port=8085，且只监听 127.0.0.1 更安全）
# keepalive：复用到后端的连接，减少高并发问答时的 TCP 握手开销
upstream reservoir_backend {
    server 127.0.0.1:8085;
    keepalive 32;
}

server {
    listen 80;
    listen 443 ssl;
    listen 443 quic;
    http2 on;
    http3 on;
    server_name zhka.demo.ai.qianxiao.xin;
    index index.html index.htm default.htm default.html;
    # 前端构建产物目录：把 frontend/dist 里的内容整体放到这里
    root /www/wwwroot/zhka/reservoir-platform;

    # 上传体积上限：与后端 spring.servlet.multipart.max-request-size=40MB 对齐
    # （多模态文件 10MB、语音 wav、CSV 导出等都由这里放行）
    client_max_body_size 40m;

    # ── 反向代理公共头（server 级，下面各 location 自动继承）────────────────────
    # 后端配置了 forward-headers-strategy: framework，会据此还原真实协议/客户端 IP，
    # 登录日志、审计日志里记录的来源地址才是访问者而不是 127.0.0.1。
    #
    # ⚠ nginx 的继承规则：proxy_set_header 只有在「当前层级一条都没写」时才继承上一级。
    #   所以某个 location 一旦写了任意一条 proxy_set_header，这里 6 条就全部失效，
    #   后端会看到 127.0.0.1、Host 变成 reservoir_backend。
    #   约定：location 内不要单独写 Connection ""，公共头统一留在本级；
    #   只有 /mqtt 这种必须改写 Connection 的 location，才把它需要的头完整重写一遍。
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    # 对应 vite.config 里的 /api 代理：问答、文件上传、语音识别、台账管理、消息
    # 用 ^~ 前缀匹配，避免被下面的静态资源正则 location 抢走；proxy_pass 不带 URI，
    # 原样转发 /api/... 给后端（后端 Controller 自带 /api 前缀）。
    location ^~ /api/ {
        proxy_pass http://reservoir_backend;

        # SSE（/api/chat/stream）：必须关闭缓冲，否则事件会被攒在 nginx 里，
        # 前端表现为"一句话等很久后整段蹦出来"或干脆超时。
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;

        # Dify 单轮最长 120s，再留足余量，避免长回答被 nginx 提前掐断
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # 上传（文件 / 语音）：请求体直接流给后端，不在 nginx 落盘
        proxy_request_buffering off;

        # upstream keepalive（proxy_http_version 1.1 + Connection ""）由 server 级统一设置。
        # 这里不要再写 proxy_set_header：一旦写了，就会丢掉 X-Real-IP / X-Forwarded-For 等公共头。
    }

    # 对应 vite.config 里的 /auth 代理：登录、注册、令牌校验
    # （不写 proxy_set_header，直接继承 server 级的真实 IP 转发头）
    location ^~ /auth/ {
        proxy_pass http://reservoir_backend;
    }

    # 对应 vite.config 里的 /health 代理：健康检查（精确匹配，避免误吞 /healthxxx）
    # （不写 proxy_set_header，继承 server 级公共头）
    location = /health {
        proxy_pass http://reservoir_backend;
        # 健康检查只读、量小，不写访问日志，避免刷爆日志文件
        access_log off;
    }

    # ── MQTT over WebSocket ─────────────────────────────────────────────────────
    # 站点走 HTTPS 时，浏览器会拦截前端的 ws:// （混合内容），所以统一成
    #   wss://zhka.demo.ai.qianxiao.xin/mqtt  →  这里  →  EMQX 的 8083
    # 构建命令：VITE_MQTT_BROKER_URL=wss://zhka.demo.ai.qianxiao.xin/mqtt npm run build
    # 注意：8083 是 EMQX 的 WebSocket 监听，不是 Java 后端的 8085。
    location ^~ /mqtt {
        proxy_pass http://127.0.0.1:8083/mqtt;
        proxy_http_version 1.1;
        # 本 location 自己写了 proxy_set_header，不会再继承 server 级，所以需要的头要写全
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    include /www/server/panel/vhost/nginx/extension/zhka.demo.ai.qianxiao.xin/*.conf;

    #CERT-APPLY-CHECK--START
    # 用于SSL证书申请时的文件验证相关配置 -- 请勿删除并保持这段设置在优先级高的位置
    include /www/server/panel/vhost/nginx/well-known/zhka.demo.ai.qianxiao.xin.conf;
    #CERT-APPLY-CHECK--END

    #SSL-START SSL相关配置，请勿删除或修改下一行带注释的404规则
    #error_page 404/404.html;
    #HTTP_TO_HTTPS_START
    set $isRedcert 1;
    if ($server_port != 443) {
        set $isRedcert 2;
    }
    if ( $uri ~ /\.well-known/ ) {
        set $isRedcert 1;
    }
    if ($isRedcert != 1) {
        rewrite ^(/.*)$ https://$host$1 permanent;
    }
    #HTTP_TO_HTTPS_END
    ssl_certificate    /www/server/panel/vhost/cert/zhka.demo.ai.qianxiao.xin/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/zhka.demo.ai.qianxiao.xin/privkey.pem;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    add_header Alt-Svc 'quic=":443"; h3=":443"; h3-29=":443"; h3-27=":443";h3-25=":443"; h3-T050=":443"; h3-Q050=":443";h3-Q049=":443";h3-Q048=":443"; h3-Q046=":443"; h3-Q043=":443"';
    quic_retry on;
    quic_gso on;
    ssl_early_data on;
    error_page 497  https://$host$request_uri;

    #SSL-END


    #ERROR-PAGE-START  错误页配置，可以注释、删除或修改
    #error_page 404 /404.html;
    #error_page 502 /502.html;
    #ERROR-PAGE-END

    #REWRITE-START URL重写规则引用,修改后将导致面板设置的伪静态规则失效
    include /www/server/panel/vhost/rewrite/html_zhka.demo.ai.qianxiao.xin.conf;
    #REWRITE-END

    # 禁止访问的敏感文件
    location ~* (\.user.ini|\.htaccess|\.htpasswd|\.env.*|\.project|\.bashrc|\.bash_profile|\.bash_logout|\.DS_Store|\.gitignore|\.gitattributes|LICENSE|README\.md|CLAUDE\.md|CHANGELOG\.md|CHANGELOG|CONTRIBUTING\.md|TODO\.md|FAQ\.md|composer\.json|composer\.lock|package(-lock)?\.json|yarn\.lock|pnpm-lock\.yaml|\.\w+~|\.swp|\.swo|\.bak(up)?|\.old|\.tmp|\.temp|\.log|\.sql(\.gz)?|docker-compose\.yml|docker\.env|Dockerfile|\.csproj|\.sln|Cargo\.toml|Cargo\.lock|go\.mod|go\.sum|phpunit\.xml|phpunit\.xml|pom\.xml|build\.gradl|pyproject\.toml|requirements\.txt|application(-\w+)?\.(ya?ml|properties))$
    {
        return 404;
    }

    # 禁止访问的敏感目录
    location ~* /(\.git|\.svn|\.bzr|\.vscode|\.claude|\.idea|\.ssh|\.github|\.npm|\.yarn|\.pnpm|\.cache|\.husky|\.turbo|\.next|\.nuxt|node_modules|runtime)/ {
        return 404;
    }

    #一键申请SSL证书验证目录相关设置
    location ~ \.well-known{
        allow all;
    }

    #禁止在证书验证目录放入敏感文件
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    # ── 静态资源缓存 ────────────────────────────────────────────────────────────
    # Vite 产物文件名带内容 hash，可以放心长缓存
    location ^~ /assets/ {
        expires      30d;
        access_log off;
        error_log /dev/null;
        try_files $uri =404;
    }

    # 入口 HTML 不缓存，保证发版后刷新即生效（expires -1 会发 no-cache，且不与上面的 add_header 冲突）
    location = /index.html {
        expires -1;
    }

    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$
    {
        expires      30d;
        error_log /dev/null;
        access_log /dev/null;
    }

    location ~ .*\.(js|css)?$
    {
        expires      12h;
        error_log /dev/null;
        access_log /dev/null;
    }

    # 这里刻意不写 `location / { try_files ... }`：
    #   1) 路由是 hash 模式（createWebHashHistory），刷新任意子页面都不会打到 nginx；
    #   2) 不写也会由 nginx 的隐式 location 从 root 提供静态文件，上面的 `index` 指令照常生效；
    #   3) 宝塔生成的 vhost 里通常已经有一个 `location /`，再写一个就直接
    #      `duplicate location "/"` 让 nginx -t 失败。
    # 以后改成 history 模式时，放开下面这段（并先删掉面板原有的 location /）：
    #
    # location / {
    #     try_files $uri $uri/ /index.html;
    # }

    access_log  /www/wwwlogs/zhka.demo.ai.qianxiao.xin.log;
    error_log  /www/wwwlogs/zhka.demo.ai.qianxiao.xin.error.log;
}
